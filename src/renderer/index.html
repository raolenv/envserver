<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:"
    />
    <title>EnvServer</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/ui.css" />
    <link rel="stylesheet" href="styles/views.css" />
    <link rel="stylesheet" href="styles/theme.css" />
    <link rel="stylesheet" href="styles/updates.css" />
  </head>
  <body>
    <!-- window chrome -->
    <header class="titlebar" id="titlebar">
      <div class="titlebar__brand">
        <img class="titlebar__logo" src="assets/icon-32.png" alt="" />
        <span class="titlebar__name">EnvServer</span>
      </div>
      <div class="titlebar__controls">
        <button class="wc-btn wc-btn--update" id="btn-updates" title="Updates and previous versions" aria-label="Updates">
          <svg viewBox="0 0 12 12" aria-hidden="true">
            <path d="M6 0.6 L10.6 5.2 H7.6 V11.4 H4.4 V5.2 H1.4 Z" />
          </svg>
          <span class="wc-btn__dot" hidden></span>
        </button>
        <button class="wc-btn" data-wc="minimize" title="Minimize" aria-label="Minimize">
          <svg viewBox="0 0 10 10" aria-hidden="true"><rect x="0" y="4.5" width="10" height="1" /></svg>
        </button>
        <button class="wc-btn" data-wc="maximize" title="Maximize" aria-label="Maximize">
          <svg viewBox="0 0 10 10" aria-hidden="true">
            <rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" />
          </svg>
        </button>
        <button class="wc-btn" data-wc="fullscreen" title="Full screen (F11)" aria-label="Full screen">
          <svg viewBox="0 0 10 10" aria-hidden="true">
            <path d="M0 3V0h3M7 0h3v3M10 7v3H7M3 10H0V7" fill="none" stroke="currentColor" stroke-width="1.1" />
          </svg>
        </button>
        <button class="wc-btn wc-btn--close" data-wc="close" title="Close" aria-label="Close">
          <svg viewBox="0 0 10 10" aria-hidden="true">
            <path d="M0 0 L10 10 M10 0 L0 10" stroke="currentColor" fill="none" />
          </svg>
        </button>
      </div>
    </header>

    <!-- the shell: sidebar + one view at a time -->
    <div id="root-app" class="shell">
      <nav class="sidebar" id="sidebar"></nav>
      <section class="content">
        <div class="content__head" id="content-head"></div>
        <div class="content__body" id="content-body"></div>
      </section>
    </div>

    <!-- welcome / long-task overlay -->
    <div id="overlay" class="overlay" hidden></div>

    <!-- the updates popover, anchored under the titlebar button -->
    <div id="updates" class="updates" hidden></div>

    <!-- toasts -->
    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
